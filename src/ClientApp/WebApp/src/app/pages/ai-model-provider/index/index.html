<div class="aimodel-provider-list-page">
  <div class="toolbar">
    <div class="d-flex align-items-center gap-2 justify-content-end p-1">
      <button mat-flat-button color="accent" (click)="openAdd()">
        {{ i18nKeys.common.add | translate }}
      </button>
    </div>
  </div>

  @if (isLoading()) {
    <div class="d-flex justify-content-center align-items-center" style="min-height: 200px;">
      <mat-spinner></mat-spinner>
    </div>
  } @else {
  <table mat-table [dataSource]="dataSource" #table="matTable">
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>
        {{ i18nKeys.aiModelProvider.name | translate }}
      </th>
      <td mat-cell *matCellDef="let item">
        <button mat-button type="button" class="table-primary-link" (click)="openDetail(item.id)">
          {{ item.name }}
        </button>
      </td>
    </ng-container>

    <ng-container matColumnDef="description">
      <th mat-header-cell *matHeaderCellDef>
        {{ i18nKeys.aiModelProvider.description | translate }}
      </th>
      <td mat-cell *matCellDef="let item">
        {{ item.description }}
      </td>
    </ng-container>

    <ng-container matColumnDef="createdTime">
      <th mat-header-cell *matHeaderCellDef>
        {{ i18nKeys.common.createdTime | translate }}
      </th>
      <td mat-cell *matCellDef="let item">
        {{ item.createdTime | date:'short' }}
      </td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>
        {{ i18nKeys.common.actions | translate }}
      </th>
      <td mat-cell *matCellDef="let item">
        <div class="table-actions">
          <button mat-icon-button class="primary" (click)="openEdit(item.id)"><mat-icon>edit</mat-icon></button>
          <button mat-icon-button class="accent" (click)="deleteItem(item.id)"><mat-icon>delete</mat-icon></button>
        </div>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

  </table>

  <mat-paginator [length]="total" [pageIndex]="(filterDto.pageIndex ?? 1) - 1" [pageSize]="filterDto.pageSize" [pageSizeOptions]="[10, 20, 50, 100]" showFirstLastButtons (page)="pageChanged($event)"></mat-paginator>
  }

</div>
