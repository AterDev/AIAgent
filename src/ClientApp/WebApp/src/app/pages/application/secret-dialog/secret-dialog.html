<mat-card>
  <mat-card-header>
    <mat-card-title>{{ i18nKeys.application.credentialsGenerated | translate }}</mat-card-title>
  </mat-card-header>
  <mat-card-content class="d-flex flex-column gap-2 p-2">
    <p class="mb-1">{{ i18nKeys.application.secretOnlyVisibleOnce | translate }}</p>

    <mat-form-field appearance="outline">
      <mat-label>{{ i18nKeys.application.apiKeyName | translate }}</mat-label>
      <input matInput [value]="data.name" readonly />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>{{ i18nKeys.application.apiKey | translate }}</mat-label>
      <input matInput [value]="data.apiKey" readonly />
      <button mat-icon-button matSuffix type="button" (click)="copy(data.apiKey, i18nKeys.application.apiKeyCopied)">
        <mat-icon>content_copy</mat-icon>
      </button>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>{{ i18nKeys.application.apiKeyExpiresAt | translate }}</mat-label>
      <input matInput [value]="data.keyExpiresAt | date:'short'" readonly />
    </mat-form-field>
  </mat-card-content>
  <mat-card-actions class="d-flex justify-content-end gap-2">
    <button mat-flat-button color="primary" type="button" (click)="copy(data.apiKey, i18nKeys.application.apiKeyCopied)">
      {{ i18nKeys.application.copyApiKey | translate }}
    </button>
    <button mat-button type="button" (click)="close()">{{ i18nKeys.common.close | translate }}</button>
  </mat-card-actions>
</mat-card>
