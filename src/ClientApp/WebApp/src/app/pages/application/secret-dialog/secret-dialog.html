<mat-card>
  <mat-card-header>
    <mat-card-title>{{ i18nKeys.application.credentialsGenerated | translate }}</mat-card-title>
  </mat-card-header>
  <mat-card-content class="d-flex flex-column gap-2 p-2">
    <p class="mb-1">{{ i18nKeys.application.secretOnlyVisibleOnce | translate }}</p>

    <mat-form-field appearance="outline">
      <mat-label>{{ i18nKeys.application.clientId | translate }}</mat-label>
      <input matInput [value]="data.clientId" readonly />
      <button mat-icon-button matSuffix type="button" (click)="copy(data.clientId, i18nKeys.application.clientIdCopied)">
        <mat-icon>content_copy</mat-icon>
      </button>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>{{ i18nKeys.application.clientSecret | translate }}</mat-label>
      <input matInput [value]="data.clientSecret" readonly />
      <button mat-icon-button matSuffix type="button" (click)="copy(data.clientSecret, i18nKeys.application.secretCopied)">
        <mat-icon>content_copy</mat-icon>
      </button>
    </mat-form-field>
  </mat-card-content>
  <mat-card-actions class="d-flex justify-content-end gap-2">
    <button mat-stroked-button type="button" (click)="copy(data.clientId, i18nKeys.application.clientIdCopied)">
      {{ i18nKeys.application.copyClientId | translate }}
    </button>
    <button mat-flat-button color="primary" type="button" (click)="copy(data.clientSecret, i18nKeys.application.secretCopied)">
      {{ i18nKeys.application.copySecret | translate }}
    </button>
    <button mat-button type="button" (click)="close()">{{ i18nKeys.common.close | translate }}</button>
  </mat-card-actions>
</mat-card>
